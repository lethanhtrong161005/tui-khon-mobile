name: tui_khon_mobile
description: "Túi Khôn - Standalone Local-First Personal Finance & AI Assistant App for iOS & Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0

  # State Management (Self-contained, lightweight & reactive)
  flutter_riverpod: ^2.5.1

  # Local Persistence & Offline-first (No external backend needed!)
  shared_preferences: ^2.2.2

  # Device Integration & Social Share
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
