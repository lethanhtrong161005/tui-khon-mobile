name: tui_khon_mobile
description: "Túi Khôn - Offline personal finance notebook and AI assistant for iOS and Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0

  # State Management (Self-contained, lightweight & reactive)
  flutter_riverpod: ^2.5.1

  # Local preferences and offline storage
  shared_preferences: ^2.2.2

  # Supabase and device integrations
  supabase_flutter: ^2.18.3
  google_sign_in: ^7.2.0
  speech_to_text: ^7.5.0
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  local_auth: ^3.0.2
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  csv: ^8.0.0
  file_picker: ^13.3.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
  assets:
    - assets/images/
    - assets/fonts/OFL.txt
